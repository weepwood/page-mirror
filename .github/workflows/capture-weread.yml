name: Capture WeRead Public Homepage

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install capture dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture public homepage
        run: node sites/weread/capture.mjs
      - name: Validate registry and run unit tests
        run: npm run validate && npm test
      - name: Save before/after review evidence
        uses: actions/upload-artifact@v7
        with:
          name: weread-reference
          path: weread-reference/
          retention-days: 7
      - name: Commit generated visual snapshot
        id: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sites/weread/
          if ! git diff --cached --quiet; then
            git commit -m "更新微信读书原站公开首页静态镜像"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes do not trigger push workflows, so deploy explicitly.
      - name: Deploy updated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
