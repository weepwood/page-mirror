name: Deploy Page Mirror

# Only the import manifest is excluded here: sync-mirrors.yml owns that path and
# dispatches this workflow after its bot commit, so one change deploys exactly once.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'robots.txt'
      - 'favicon.svg'
      - 'package.json'
      - 'sites/**'
      - '!sites/mirror-sources.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'robots.txt'
      - 'favicon.svg'
      - 'package.json'
      - 'sites/**'
      - '!sites/mirror-sources.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/inftab-app/package-lock.json
      - name: Validate import configuration and site registry
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build independent sites
        run: npm run build
      - name: Upload site build artifact for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: page-mirror-build
          path: .site-build/
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download site build artifact
        uses: actions/download-artifact@v8
        with:
          name: page-mirror-build
          path: .site-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
