name: Import public mirror repositories

# Only a manifest change starts an import. pages.yml ignores that same path and
# is dispatched here afterwards, so one change deploys exactly once. Import/validation
# script changes are covered by pages.yml's validate + test jobs instead.
on:
  push:
    branches: [main]
    paths:
      - 'sites/mirror-sources.json'
  workflow_dispatch:
    inputs:
      refresh_slug:
        description: '仅更新指定镜像 slug（留空为首次导入全部；更新会覆盖该子目录）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: public-mirror-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mirror sources and site registry
        run: npm run validate
      - name: Import public source repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REFRESH_SLUG: ${{ inputs.refresh_slug }}
        run: |
          if [ -n "$MIRROR_REFRESH_SLUG" ]; then
            node scripts/import-mirrors.mjs --only="$MIRROR_REFRESH_SLUG" --refresh
          else
            node scripts/import-mirrors.mjs
          fi
      - name: Validate registry and run unit tests
        run: npm run validate && npm test
      - name: Commit migrated site sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/
          if ! git diff --cached --quiet; then
            git commit -m "导入公开镜像源码并更新统一站点目录"
            git push origin HEAD:main
          else
            echo "No new mirrors to commit."
          fi

      # GITHUB_TOKEN 推送的提交不会自动触发 push 工作流；显式调度发布。
      - name: Deploy updated mirror collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
