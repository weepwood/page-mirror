<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Page Mirror — 独立网站复刻项目目录">
  <title>Page Mirror — 网站镜像目录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b9f36a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='%23111410'%3EP%3C/text%3E%3C/svg%3E">
  <style>
    /* Design constraints — Refactoring UI
       §2.1    hierarchy: hero headline > card title > metadata; one primary action per card.
       §1.5    every size, space, radius and color below comes from the token scale.
       §2.2    two weights (400/600), three text tiers; semantic colors only for state.
       §3.2.1  spacing scale steps stay >=25% apart; §4.1 one hand-picked type scale.
       §6.4.1  dark-mode elevation is carried by lighter surfaces, never by shadows.
       §5.7    state never relies on color alone: dot + label + aria-pressed.
       §15     focus-visible rings, reduced-motion and target sizes are extensions, not book rules.
       Deliberate convention kept: fixed dark theme, lime accent, oversized hero headline. */
    :root{
      color-scheme:dark;
      --surface-0:#101114; --surface-1:#16181e; --surface-2:#1c1f26; --surface-3:#242832;
      --text-1:#f2f4f7; --text-2:#c2c7d2; --text-3:#949aa8;
      --lime-100:#eefbdc; --lime-400:#b9f36a; --lime-600:#7fb23a;
      --action:var(--lime-400); --on-action:#111410; --on-action-subtle:#3d5522;
      --line:#2a2d36; --line-strong:#414754;
      --success:var(--lime-400); --success-line:#47662f;
      --warning:#e8c477; --warning-line:#66583a;
      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
      --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
      --fs-xs:12px; --fs-sm:14px; --fs-base:16px; --fs-lg:18px; --fs-xl:24px;
      --fs-display:clamp(40px,7vw,72px);
      --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
      --fw:400; --fw-strong:600;
      --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
      --dur:180ms; --ease:cubic-bezier(.2,.8,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(ellipse 60% 42% at 12% -10%,#1d2718 0,transparent 72%),var(--surface-0);color:var(--text-1);font:var(--fw) var(--fs-base)/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    ::selection{background:var(--lime-600);color:var(--on-action)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    /* §15 focus: outline:none on inputs is replaced by a 3:1 ring with an offset. */
    .card:focus-visible,.chip:focus-visible,.toplink:focus-visible,.clear:focus-visible,.skip:focus-visible{outline:2px solid var(--action);outline-offset:3px}
    .field:has(:focus-visible){outline:2px solid var(--action);outline-offset:2px}
    @supports not selector(:has(*)){.field:focus-within{outline:2px solid var(--action);outline-offset:2px}}
    .field input,.field select{outline:none}
    .skip{position:absolute;left:var(--sp-4);top:-60px;z-index:10;padding:var(--sp-2) var(--sp-3);background:var(--action);color:var(--on-action);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:var(--fw-strong);text-decoration:none;transition:top var(--dur) var(--ease)}
    .skip:focus{top:var(--sp-3)}
    .wrap{max-width:1120px;margin:auto;padding:var(--sp-6) var(--sp-5) var(--sp-8)}
    header{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);border-bottom:1px solid var(--line);padding-bottom:var(--sp-5)}
    /* §4.8.2 uppercase always gets positive tracking. */
    .brand{display:flex;align-items:center;gap:var(--sp-3);text-decoration:none;font-size:var(--fs-base);font-weight:var(--fw-strong);letter-spacing:.08em;text-transform:uppercase}
    .mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--action);color:var(--on-action);display:grid;place-items:center;font-size:var(--fs-lg);font-weight:var(--fw-strong);letter-spacing:0}
    .toplink{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-2) 0;font-size:var(--fs-sm);color:var(--text-3);text-decoration:none;transition:color var(--dur) var(--ease)}
    .toplink:hover{color:var(--text-1);text-decoration:underline;text-underline-offset:4px}
    .hero{padding:var(--sp-8) 0 var(--sp-7);max-width:760px}
    .eyebrow{margin:0;color:var(--action);font-size:var(--fs-xs);font-weight:var(--fw-strong);letter-spacing:.14em;text-transform:uppercase}
    /* §4.5.2 large headings drop their line-height. */
    h1{font-size:var(--fs-display);line-height:1.02;letter-spacing:-.06em;font-weight:var(--fw-strong);margin:var(--sp-4) 0 var(--sp-5)}
    .lede{margin:0;max-width:38em;color:var(--text-2);font-size:var(--fs-lg);line-height:1.7}
    /* §3.6 outer spacing (32px) exceeds inner spacing (4px). */
    .toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);margin:var(--sp-6) 0 var(--sp-4)}
    .toolbar h2{font-size:var(--fs-xl);line-height:1.2;letter-spacing:-.03em;font-weight:var(--fw-strong);margin:0 0 var(--sp-1)}
    .summary{margin:0;color:var(--text-3);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
    .controls{display:flex;align-items:center;gap:var(--sp-3)}
    /* §8.1 no native form control chrome; §6.1.3 a darker well reads as inset. */
    .field{position:relative;display:flex;align-items:center;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-3);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
    .field:hover{border-color:var(--line-strong)}
    .field input,.field select{appearance:none;border:0;background:transparent;color:var(--text-1);font:inherit;font-size:var(--fs-sm);min-width:0}
    .field input{width:min(280px,42vw);padding:var(--sp-2) 0}
    .field input::placeholder{color:var(--text-3)}
    .field input::-webkit-search-cancel-button{-webkit-appearance:none}
    .field select{padding:var(--sp-2) var(--sp-5) var(--sp-2) 0;cursor:pointer}
    .field--sort::after{content:"";position:absolute;right:var(--sp-3);top:50%;transform:translateY(-25%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text-3);pointer-events:none}
    .field--search svg{width:16px;height:16px;flex:none;color:var(--text-3)}
    .kbd{font:var(--fw) var(--fs-xs)/1 var(--mono);color:var(--text-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 6px;pointer-events:none}
    .filters{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:0 0 var(--sp-4)}
    .chip{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:36px;padding:var(--sp-2) var(--sp-3);font:inherit;font-size:var(--fs-xs);line-height:1.4;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-1);color:var(--text-2);cursor:pointer;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
    .chip:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--text-1)}
    .chip[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--on-action);font-weight:var(--fw-strong)}
    .chip .n{font-variant-numeric:tabular-nums;color:var(--text-3)}
    /* §2.3 same-hue dark text on the lime chip, not white at reduced opacity. */
    .chip[aria-pressed="true"] .n{color:var(--on-action-subtle)}
    /* §3.4.2 one auto-filling grid instead of a breakpoint-driven column count. */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:var(--sp-4)}
    .card{display:flex;flex-direction:column;min-height:200px;padding:var(--sp-5);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);text-decoration:none;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
    .card:hover{background:var(--surface-3);border-color:var(--line-strong);transform:translateY(-2px)}
    .cardtop{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
    .slug{font:var(--fw) var(--fs-xs)/1.4 var(--mono);color:var(--text-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:var(--fs-xs);line-height:1.4;padding:3px var(--sp-2);border:1px solid var(--line);border-radius:var(--r-pill);color:var(--text-2)}
    .status[data-tone="success"]{color:var(--success);border-color:var(--success-line)}
    .status[data-tone="warning"]{color:var(--warning);border-color:var(--warning-line)}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    .card h3{font-size:var(--fs-xl);line-height:1.2;letter-spacing:-.03em;font-weight:var(--fw-strong);margin:var(--sp-5) 0 var(--sp-2)}
    .card p{margin:0;color:var(--text-2);font-size:var(--fs-sm);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .cardbottom{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin-top:auto;padding-top:var(--sp-5);font-size:var(--fs-xs);color:var(--text-3)}
    .meta{display:flex;align-items:baseline;gap:var(--sp-2);min-width:0}
    .origin{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .date{flex:none;font-variant-numeric:tabular-nums}
    .date::before{content:"· "}
    .arrow{color:var(--action);font-size:var(--fs-lg);line-height:1;transition:transform var(--dur) var(--ease)}
    .card:hover .arrow{transform:translate(2px,-2px)}
    /* §8.4 loading, empty and error states are designed as part of the feature. */
    .empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-7) var(--sp-5);text-align:center;border:1px dashed var(--line-strong);border-radius:var(--r-lg);color:var(--text-3)}
    .empty strong{color:var(--text-1);font-size:var(--fs-lg);font-weight:var(--fw-strong)}
    .empty svg{color:var(--text-3);margin-bottom:var(--sp-1)}
    .clear{margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);font:inherit;font-size:var(--fs-sm);color:var(--text-1);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-md);cursor:pointer;transition:background var(--dur) var(--ease)}
    .clear:hover{background:var(--surface-3)}
    .skeleton{pointer-events:none}
    .sk{display:block;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:shimmer 1.6s linear infinite}
    .sk-sm{width:28%;height:10px}
    .sk-lg{width:64%;height:22px;margin-top:var(--sp-6)}
    .sk-md{width:100%;height:12px;margin-top:var(--sp-4)}
    .sk-md2{width:80%;height:12px;margin-top:var(--sp-2)}
    .sk-xs{width:45%;height:10px;margin-top:auto}
    @keyframes shimmer{to{background-position:-200% 0}}
    footer{display:flex;justify-content:space-between;gap:var(--sp-4);margin-top:var(--sp-8);padding-top:var(--sp-5);border-top:1px solid var(--line);color:var(--text-3);font-size:var(--fs-xs)}
    @media(max-width:650px){
      .wrap{padding:var(--sp-5) var(--sp-4) var(--sp-7)}
      .hero{padding:var(--sp-7) 0 var(--sp-6)}
      h1{letter-spacing:-.05em}
      .toolbar{align-items:flex-start;flex-direction:column}
      .controls{width:100%;flex-wrap:wrap}
      .field--search{flex:1 1 100%}
      .field--search input{flex:1 1 auto;width:auto}
      footer{flex-direction:column;gap:var(--sp-2)}
    }
    /* §15 motion: 180ms transitions are disabled when the user asks for reduced motion. */
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      .card:hover,.chip:hover{transform:none}
      .card:hover .arrow{transform:none}
    }
  </style>
</head>
<body>
  <a class="skip" href="#sites">跳到站点列表</a>
  <main class="wrap">
    <header>
      <a class="brand" href="./"><span class="mark">P</span><span>PAGE MIRROR</span></a>
      <a class="toplink" href="https://github.com/weepwood/page-mirror">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <section class="hero">
      <p class="eyebrow">Independent recreations · One index</p>
      <h1>The web,<br>reconstructed.</h1>
      <p class="lede">一个统一管理独立网站复刻项目的目录。每个站点单独实现、单独维护、单独验收；这里负责索引与展示。</p>
    </section>
    <section aria-labelledby="directory-title">
      <div class="toolbar">
        <div>
          <h2 id="directory-title">镜像站点</h2>
          <p class="summary" id="summary" aria-live="polite">正在读取站点清单…</p>
        </div>
        <div class="controls">
          <label class="field field--sort">
            <span class="sr-only">排序方式</span>
            <select id="sort">
              <option value="slug">按标识</option>
              <option value="name">按名称</option>
              <option value="updated">按更新时间</option>
              <option value="status">按状态</option>
            </select>
          </label>
          <label class="field field--search" title="按 / 聚焦搜索">
            <span class="sr-only">搜索镜像站点</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <input id="search" type="search" placeholder="搜索名称、域名或标识…" autocomplete="off">
            <kbd class="kbd" aria-hidden="true">/</kbd>
          </label>
        </div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="按状态筛选"></div>
      <div class="grid" id="sites" aria-busy="true">
        <div class="card skeleton" aria-hidden="true"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span><span class="sk sk-md2"></span><span class="sk sk-xs"></span></div>
        <div class="card skeleton" aria-hidden="true"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span><span class="sk sk-md2"></span><span class="sk sk-xs"></span></div>
        <div class="card skeleton" aria-hidden="true"><span class="sk sk-sm"></span><span class="sk sk-lg"></span><span class="sk sk-md"></span><span class="sk sk-md2"></span><span class="sk sk-xs"></span></div>
      </div>
    </section>
    <footer><span>PAGE MIRROR · 站点独立，目录统一</span><span>仅展示已登记项目；完成状态需经过对照验收。</span></footer>
  </main>
  <script>
    const list = document.querySelector('#sites');
    const summary = document.querySelector('#summary');
    const search = document.querySelector('#search');
    const sort = document.querySelector('#sort');
    const filters = document.querySelector('#filters');
    const labels = {planned:'计划中',building:'复刻中',review:'待验收',completed:'已验收',paused:'已暂停'};
    const tones = {completed:'success',building:'warning'};
    const statusOrder = ['building','review','completed','planned','paused'];
    let sites = [], statusFilter = 'all', sortBy = 'slug';
    function esc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function emptyMarkup(title,hint,clearable){
      return '<div class="empty"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><strong>'+title+'</strong><span>'+hint+'</span>'+(clearable?'<button type="button" class="clear" id="clear">清除筛选</button>':'')+'</div>';
    }
    /* Filters are built once and only their aria-pressed state changes afterwards,
       so keyboard focus survives every re-render (§15 focus states). */
    function buildFilters(){
      const counts = {};
      for(const s of sites){const key=s.status||'planned';counts[key]=(counts[key]||0)+1;}
      const items = [{key:'all',label:'全部',n:sites.length}];
      for(const key of statusOrder) if(counts[key]) items.push({key,label:labels[key]||key,n:counts[key]});
      filters.innerHTML = items.map(i=>'<button type="button" class="chip" data-status="'+esc(i.key)+'" aria-pressed="false">'+esc(i.label)+'<span class="n">'+i.n+'</span></button>').join('');
    }
    function syncFilters(){
      for(const btn of filters.querySelectorAll('.chip')) btn.setAttribute('aria-pressed',String(btn.dataset.status===statusFilter));
    }
    function rank(s){const i=statusOrder.indexOf(s.status);return i<0?statusOrder.length:i;}
    function comparator(a,b){
      if(sortBy==='name') return (a.name||a.slug).localeCompare(b.name||b.slug,'zh-Hans-CN')||a.slug.localeCompare(b.slug);
      if(sortBy==='updated') return (b.updatedAt||'').localeCompare(a.updatedAt||'')||a.slug.localeCompare(b.slug);
      if(sortBy==='status') return rank(a)-rank(b)||a.slug.localeCompare(b.slug);
      return a.slug.localeCompare(b.slug);
    }
    function render(){
      syncFilters();
      const q=search.value.trim().toLowerCase();
      const shown=sites
        .filter(s=>[s.name,s.slug,s.description,s.sourceUrl].join(' ').toLowerCase().includes(q))
        .filter(s=>statusFilter==='all'||(s.status||'planned')===statusFilter)
        .sort(comparator);
      const completed=sites.filter(s=>s.status==='completed').length;
      const counter=shown.length===sites.length?sites.length+' 个站点':'显示 '+shown.length+' / '+sites.length+' 个站点';
      summary.textContent=sites.length?counter+' · '+completed+' 个已验收':'尚无登记站点';
      if(!shown.length){
        const title=sites.length?'没有找到匹配的站点':'镜像站点目录已就绪';
        const hint=sites.length?'试试其他关键词，或切换状态筛选。':'添加第一个站点后，它会显示在这里。子项目应放在 sites/&lt;slug&gt;/ 下，并登记到 registry.json。';
        list.innerHTML=emptyMarkup(title,hint,sites.length>0);
        const clear=document.querySelector('#clear');
        if(clear) clear.addEventListener('click',()=>{search.value='';statusFilter='all';search.focus();render();});
        return;
      }
      list.innerHTML=shown.map(s=>{
        const href=s.previewPath||('sites/'+encodeURIComponent(s.slug)+'/');
        const status=s.status||'planned';
        const tone=tones[status]||'neutral';
        return '<a class="card" href="'+esc(href)+'"><div class="cardtop"><span class="slug">'+esc(s.slug)+'</span><span class="status" data-tone="'+tone+'"><span class="dot" aria-hidden="true"></span>'+esc(labels[status]||status)+'</span></div><h3>'+esc(s.name||s.slug)+'</h3><p>'+esc(s.description||'尚未填写项目说明。')+'</p><div class="cardbottom"><span class="meta"><span class="origin">'+esc(s.sourceUrl||'原站地址待补充')+'</span>'+(s.updatedAt?'<span class="date">'+esc(s.updatedAt)+'</span>':'')+'</span><span class="arrow" aria-hidden="true">↗</span></div></a>';
      }).join('');
    }
    filters.addEventListener('click',e=>{
      const btn=e.target.closest('.chip');
      if(!btn) return;
      statusFilter=btn.dataset.status;
      render();
    });
    search.addEventListener('input',render);
    sort.addEventListener('change',()=>{sortBy=sort.value;render();});
    document.addEventListener('keydown',e=>{
      if(e.key!=='/'||e.metaKey||e.ctrlKey||e.altKey) return;
      const t=e.target;
      if(t instanceof HTMLElement&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      e.preventDefault();
      search.focus();
    });
    fetch('./sites/registry.json')
      .then(r=>{if(!r.ok)throw new Error('registry unavailable');return r.json();})
      .then(data=>{sites=Array.isArray(data.sites)?data.sites:[];list.removeAttribute('aria-busy');buildFilters();render();})
      .catch(()=>{
        list.removeAttribute('aria-busy');
        summary.textContent='无法加载站点清单';
        filters.innerHTML='';
        list.innerHTML=emptyMarkup('站点清单读取失败','请检查 sites/registry.json 是否存在且为有效 JSON。',false);
      });
  </script>
</body>
</html>
