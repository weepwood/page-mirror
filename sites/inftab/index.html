<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9edf0">
  <meta name="description" content="Infinity Homepage — a visual new-tab style start page with search and shortcut tiles.">
  <title>Infinity Homepage — Mirror</title>
  <style>
    :root{color-scheme:light;--tile:rgba(255,255,255,.92);--shadow:0 5px 18px rgba(17,24,31,.19);--muted:#737b83;--accent:#ff4b55}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#343b42;background:#d4d9dc;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    .wallpaper{position:fixed;inset:0;background:linear-gradient(132deg,#76bef4 0%,#a5a4e8 27%,#b247bc 51%,#ec2b92 72%,#fa397e 100%);transform:scale(1.015)}
    .wallpaper:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 12% 20%,rgba(255,255,255,.13),transparent 40%),linear-gradient(135deg,rgba(68,56,184,.05),rgba(255,0,114,.08))}
    .page{position:relative;z-index:1;min-height:100%;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center}
    .topbar{position:absolute;top:22px;right:24px;display:flex;gap:9px;align-items:center}
    .icon-button{width:34px;height:34px;border:1px solid rgba(255,255,255,.48);border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px);transition:background .18s,transform .18s}
    .icon-button:hover{background:rgba(255,255,255,.35);transform:translateY(-1px)}
    .icon-button svg{width:17px;height:17px}
    .workspace{width:min(780px,calc(100% - 32px));padding-top:22vh;display:flex;flex-direction:column;align-items:center;margin:0 auto}
    .search-wrap{position:relative;width:min(480px,100%);z-index:4}
    .search-box{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:7px;box-shadow:0 5px 18px rgba(0,0,0,.12);transition:box-shadow .18s}
    .search-box:focus-within{box-shadow:0 7px 24px rgba(0,0,0,.2)}
    .brand-search{width:23px;height:23px;flex:none}
    .search-input{border:0;outline:0;background:transparent;min-width:0;flex:1;height:100%;font-size:15px;color:#333;letter-spacing:.1px}
    .search-input::placeholder{color:#d0d3d5}
    .clear-search{display:none;border:0;background:transparent;color:#a4a8ab;font-size:22px;line-height:1;padding:2px}
    .clear-search.show{display:block}
    .engine-strip{display:none;position:absolute;left:0;right:0;top:54px;min-height:54px;padding:0 6px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.82);border-radius:0 0 7px 7px;box-shadow:0 8px 22px rgba(0,0,0,.15);grid-template-columns:repeat(7,minmax(0,1fr));align-items:stretch}
    .engine-strip.open{display:grid}
    .engine{border:0;background:transparent;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;color:#8c9398}
    .engine:after{content:"";position:absolute;left:25%;right:25%;bottom:5px;height:2px;border-radius:2px;background:transparent}
    .engine.active:after{background:#ffcf36}
    .engine:hover{background:rgba(20,30,40,.035)}
    .engine svg{width:27px;height:27px;max-width:100%}
    .engine.add-engine{font-size:26px;font-weight:300;color:#aeb3b7}
    .shortcuts{width:min(620px,100%);margin-top:39px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:22px;row-gap:27px;align-items:start;justify-items:center}
    .shortcut{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0;position:relative}
    .tile{position:relative;width:68px;height:68px;max-width:100%;border:0;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow);color:#fff;text-decoration:none;transition:transform .17s,box-shadow .17s;overflow:hidden}
    .tile:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 9px 24px rgba(0,0,0,.25)}
    .tile:focus-visible,.icon-button:focus-visible,.engine:focus-visible,.page-dot:focus-visible{outline:3px solid #ffdb55;outline-offset:3px}
    .tile svg{width:36px;height:36px;display:block}
    .tile .letter{font-size:43px;font-weight:700;line-height:1}
    .tile-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.94);font-size:11px;text-shadow:0 1px 4px rgba(0,0,0,.55);opacity:0;transition:opacity .16s}
    .shortcut:hover .tile-name,.shortcut:focus-within .tile-name{opacity:1}
    .tile-more{position:absolute;right:-5px;top:-5px;width:24px;height:24px;border:1px solid #fff;border-radius:50%;background:rgba(28,35,40,.75);color:#fff;font-size:17px;line-height:1;display:none;place-items:center}
    body.editing .tile-more{display:grid}
    .page-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:25px 0 0}
    .page-dot{width:11px;height:11px;border:0;padding:0;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .18s,background .18s}
    .page-dot.active{background:rgba(255,255,255,.91);transform:scale(1.08)}
    .page-dot:hover{background:#fff}
    .bottom-note{position:fixed;z-index:2;bottom:10px;left:13px;max-width:min(520px,calc(100% - 26px));font-size:10px;line-height:1.4;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.45)}
    .bottom-note a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .status{position:fixed;z-index:5;bottom:14px;right:16px;padding:8px 11px;background:rgba(25,31,36,.76);color:#fff;font-size:12px;border-radius:6px;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .2s,transform .2s}
    .status.show{opacity:1;transform:none}
    .modal-backdrop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,29,.38);backdrop-filter:blur(6px)}
    .modal-backdrop.open{display:flex}
    .modal{width:min(390px,100%);background:#fff;border-radius:12px;padding:23px;box-shadow:0 18px 65px rgba(0,0,0,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .modal h2{font-size:18px;margin:0;font-weight:600}
    .modal-close{border:0;background:transparent;font-size:24px;color:#828a90;line-height:1}
    .field{display:block;margin:13px 0 0}
    .field span{display:block;font-size:12px;color:#70777c;margin-bottom:6px}
    .field input{width:100%;height:40px;border:1px solid #dfe3e5;border-radius:6px;padding:0 11px;outline:0;color:#2c3338}
    .field input:focus{border-color:#95b8e5;box-shadow:0 0 0 3px #eaf3ff}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
    .btn{height:37px;padding:0 15px;border:1px solid #dfe3e5;border-radius:6px;background:#fff;color:#4b5257;font-size:13px}
    .btn.primary{border-color:#ff4b55;background:#ff4b55;color:white}
    .small-hint{font-size:11px;color:#93999d;line-height:1.5;margin-top:12px}
    @media(max-width:720px){.workspace{padding-top:19vh}.shortcuts{width:min(520px,100%);grid-template-columns:repeat(6,minmax(0,1fr));column-gap:10px;row-gap:23px;margin-top:40px}.tile{width:58px;height:58px}.tile svg{width:31px;height:31px}.tile .letter{font-size:37px}.topbar{top:14px;right:14px}.engine-strip{grid-template-columns:repeat(7,minmax(0,1fr))}.bottom-note{max-width:calc(100% - 26px)}}
    @media(max-width:390px){.workspace{width:calc(100% - 22px);padding-top:17vh}.search-box{height:47px}.shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;row-gap:19px;margin-top:34px}.tile{width:49px;height:49px}.tile svg{width:27px;height:27px}.tile .letter{font-size:32px}.tile-name{font-size:10px}.page-nav{margin-top:20px}.bottom-note{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <main class="page">
    <div class="topbar" aria-label="Page controls">
      <button id="edit-toggle" class="icon-button" type="button" aria-label="Edit shortcuts" title="Edit shortcuts">

    </div>
    <div class="workspace">

        </form>
        <div id="engine-strip" class="engine-strip" aria-label="Choose search engine"></div>
      </div>
      <div id="shortcuts" class="shortcuts" aria-label="Website shortcuts"></div>
      <nav id="page-nav" class="page-nav" aria-label="Shortcut pages"></nav>

    <div class="bottom-note">As an eBay Partner Network Affiliate, we earn from qualifying purchases. We may also earn from other affiliate partners. <a href="https://inftab.com/" target="_blank" rel="noopener noreferrer">Learn more</a></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

      <form id="shortcut-form">
        <label class="field"><span>Website name</span><input id="site-name" maxlength="28" required placeholder="e.g. GitHub"></label>
        <label class="field"><span>Website URL</span><input id="site-url" type="url" required placeholder="https://example.com"></label>
        <p class="small-hint">Shortcuts are saved in this browser only. This static mirror does not connect to Infinity's account or cloud-sync services.</p>
        <div class="modal-actions"><button id="cancel-modal" class="btn" type="button">Cancel</button><button class="btn primary" type="submit">Save shortcut</button></div>
      </form>
    </section>
  </div>
