    body{overflow:hidden;background:#27383f;color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    .scene{position:fixed;inset:0;overflow:hidden;background:#27383f}
    /* The original Infinity promotional screenshot is used as a visual reference layer.
       Cropping its browser frame leaves the actual New Tab canvas and original art. */
    .reference-canvas{position:absolute;inset:0;background-image:url("https://en.inftab.com/index/img/img_search.jpg?v=4a26fa7");background-repeat:no-repeat;background-position:center -12.84vh;background-size:auto 116.73vh}
    .interactive-layer{position:absolute;inset:0}
    .search-form{position:absolute;left:24.47%;top:19.26vh;width:51.06%;height:9.34vh;min-height:42px;max-height:102px;display:flex;align-items:center;gap:clamp(8px,1.3vw,24px);padding:0 clamp(10px,1.55vw,30px);border:0;border-radius:clamp(5px,.7vw,12px);background:#fff;box-shadow:none}
    .search-logo{width:clamp(16px,3.3vh,36px);height:clamp(16px,3.3vh,36px);flex:none}
    .search-input{width:100%;height:100%;min-width:0;outline:0;border:0;background:transparent;color:#373b40;font-size:clamp(14px,1.65vh,18px);font-weight:400;padding:0}
    .search-input{font-size:clamp(14px,3.1vh,34px)}
    .search-input::placeholder{color:#e4e4e4;opacity:1}
    .search-form:focus-within{box-shadow:0 1px 5px rgba(0,0,0,.08)}
    .engine-strip{position:absolute;left:24.47%;top:29.8vh;width:51.06%;height:14.2vh;min-height:64px;max-height:154px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:stretch;overflow:hidden;border-radius:4px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.09)}
    .engine-button{appearance:none;display:flex;align-items:center;justify-content:center;min-width:0;width:100%;height:100%;border:0;border-right:1px solid #f0f0f0;background:#fff;padding:0;cursor:pointer}
    .engine-button:last-child{border-right:0}
    .engine-button svg{display:block;width:min(3vw,4.5vh,48px);height:min(3vw,4.5vh,48px);max-width:82%;max-height:62%;overflow:visible}
    .engine-button:last-child svg{width:min(3.6vw,5vh,52px);height:min(3.6vw,5vh,52px)}

    .shortcut:hover{transform:translate(-50%,-50%) scale(1.055);box-shadow:0 5px 15px rgba(0,0,0,.2)}
    .shortcut:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .shortcut svg{display:block;width:61%;height:61%;overflow:visible}
    .shortcut .wordmark{font:700 10px Arial,sans-serif;fill:#fff}
    .pager{position:absolute;top:86.6vh;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(8px,1.25vw,24px)}
    .page-dot{width:clamp(8px,1.15vw,21px);height:clamp(8px,1.15vw,21px);border:0;border-radius:50%;background:rgba(255,255,255,.48);padding:0;cursor:pointer;box-shadow:none}

    .page-dot:focus-visible{outline:2px solid white;outline-offset:4px}

    .affiliate a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .toast{position:fixed;z-index:10;left:50%;bottom:32px;transform:translate(-50%,8px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:6px;background:rgba(20,27,31,.85);color:#fff;font-size:12px;transition:opacity .18s,transform .18s;white-space:nowrap}
    .toast.visible{opacity:1;transform:translate(-50%,0)}
    .modal-shade{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;padding:18px;background:rgba(10,17,22,.38);backdrop-filter:blur(5px)}
    .modal-shade.open{display:flex}

    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .modal h2{margin:0;font-size:17px;font-weight:600}
    .close{border:0;background:transparent;font-size:23px;color:#858b8f;cursor:pointer}
    .field{display:block;margin-top:13px}
    .field span{display:block;margin-bottom:6px;color:#70777d;font-size:12px}
    .field input{width:100%;height:39px;padding:0 10px;border:1px solid #dce1e4;border-radius:5px;outline:0}
    .field input:focus{border-color:#8eb6dd;box-shadow:0 0 0 3px #eaf4fc}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .btn{height:35px;padding:0 13px;border:1px solid #dce1e4;border-radius:5px;background:white;color:#454e54;cursor:pointer;font-size:12px}
    .btn.primary{background:#ff4b55;border-color:#ff4b55;color:#fff}
    .help{margin:12px 0 0;color:#92999d;font-size:11px;line-height:1.5}

      .search-form{left:5%;top:18vh;width:90%;height:49px;max-height:49px;border-radius:7px;padding:0 14px;gap:12px}
      .search-logo{width:23px;height:23px}
      .search-input{font-size:15px}
      .search-input{font-size:15px}
      .engine-strip{left:5%;top:25vh;width:90%;height:48px;min-height:48px;max-height:48px;border-radius:4px}
      .shortcut-grid{position:absolute;inset:31vh 7% auto;height:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:12px;row-gap:20px;justify-items:center;pointer-events:none}
      .shortcut{position:relative;left:auto;top:auto;transform:none;width:min(58px,15vw);pointer-events:auto}
      .shortcut:hover{transform:scale(1.04)}

      .pager{top:auto;bottom:10vh}
      .page-dot{width:10px;height:10px}

          {name:"Wikipedia",url:"https://www.wikipedia.org/",icon:"wikipedia",bg:"#fff"},
          {name:"eBay",url:"https://www.ebay.com/",icon:"amazon",bg:"#fff"},
          {name:"Booking",url:"https://www.booking.com/",icon:"apps",bg:"#003b95"}
        ]
      ];
      var currentPage=0;
      var currentEngine="infinity";
      try{currentEngine=localStorage.getItem("inftab-mirror-current-engine")||"infinity";}catch(e){}
      var customEngines=[];
      try{var stored=JSON.parse(localStorage.getItem("inftab-mirror-engines-v1")||"[]");if(Array.isArray(stored))customEngines=stored.filter(function(x){return x&&x.id&&x.name&&x.url;});}catch(e){}
      var engineContainer=document.getElementById("engine-strip");
      var shortcutContainer=document.getElementById("shortcut-grid");
      var pager=document.getElementById("pager");
      var searchInput=document.getElementById("search-input");
      var shade=document.getElementById("modal-shade");
      var toast=document.getElementById("toast");
      function allEngines(){return engines.slice(0,6).concat(customEngines).concat([engines[6]]);}
      function visibleEngines(){
        var activeCustom=customEngines.find(function(x){return x.id===currentEngine;});
        return (activeCustom?[activeCustom].concat(engines.slice(1,6)):engines.slice(0,6)).concat([engines[6]]);
      }
      function safeUrl(url){try{var u=new URL(url);return (u.protocol==="http:"||u.protocol==="https:")?u.href:null;}catch(e){return null;}}
      function notify(message){toast.textContent=message;toast.classList.add("visible");window.clearTimeout(notify.timer);notify.timer=window.setTimeout(function(){toast.classList.remove("visible");},2200);}
      function escapeAttr(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
      function renderEngines(){
        engineContainer.innerHTML="";
        visibleEngines().forEach(function(engine){
          var b=document.createElement("button");b.type="button";b.className="engine-button";b.title=engine.name;b.setAttribute("aria-label","Use "+engine.name+" for search");b.setAttribute("aria-pressed",engine.id===currentEngine?"true":"false");
          b.innerHTML=icon[engine.icon]||icon.plus;
          b.addEventListener("click",function(){if(engine.id==="add"){openEngineModal();return;}currentEngine=engine.id;try{localStorage.setItem("inftab-mirror-current-engine",currentEngine);}catch(e){}renderEngines();});
          engineContainer.appendChild(b);
        });
      }
      function renderShortcuts(){
        shortcutContainer.innerHTML="";
        var items=defaultPages[currentPage]||defaultPages[0];
        items.slice(0,10).forEach(function(item,index){
          var a=document.createElement("a");a.className="shortcut";a.href=safeUrl(item.url)||"#";a.target="_blank";a.rel="noopener noreferrer";a.title=item.name;a.setAttribute("aria-label",item.name);a.style.setProperty("--bg",item.bg);
          var col=index%5,row=Math.floor(index/5);
          a.style.setProperty("--x",["22.65%","36.18%","49.89%","63.40%","77.13%"][col]);
          a.style.setProperty("--y",row===0?"46.89vh":"67.12vh");
          a.innerHTML=icon[item.icon]||'<span aria-hidden="true">'+escapeAttr(item.name.charAt(0))+'</span>';
          shortcutContainer.appendChild(a);
        });
        pager.innerHTML="";
        defaultPages.forEach(function(_,index){
          var b=document.createElement("button");b.type="button";b.className="page-dot";b.setAttribute("aria-label","Shortcut page "+(index+1));b.setAttribute("aria-current",index===currentPage?"page":"false");
          b.addEventListener("click",function(){currentPage=index;renderShortcuts();});
          pager.appendChild(b);
        });
      }
      function openEngineModal(){shade.classList.add("open");document.getElementById("modal-title").textContent="Add search engine";document.getElementById("engine-form").reset();setTimeout(function(){document.getElementById("engine-name").focus();},40);}
      function closeModal(){shade.classList.remove("open");}
      document.getElementById("search-form").addEventListener("submit",function(e){
        e.preventDefault();var q=searchInput.value.trim();if(!q)return;
        var engine=allEngines().find(function(x){return x.id===currentEngine;})||engines[1];
        var url=engine.url.replace(/%s/g,encodeURIComponent(q));
        window.location.href=url;
      });
      document.getElementById("engine-form").addEventListener("submit",function(e){
        e.preventDefault();var name=document.getElementById("engine-name").value.trim();var url=document.getElementById("engine-url").value.trim();
        if(!name||!safeUrl(url.replace(/%s/g,"query"))){notify("Enter a valid http(s) search URL.");return;}
        var engineId="custom-"+Date.now();
        customEngines.push({id:engineId,name:name,url:url,icon:"google"});
        currentEngine=engineId;
        try{localStorage.setItem("inftab-mirror-engines-v1",JSON.stringify(customEngines));localStorage.setItem("inftab-mirror-current-engine",currentEngine);}catch(e){}
        closeModal();renderEngines();notify("Search engine added.");
      });
      document.getElementById("close-modal").addEventListener("click",closeModal);
      document.getElementById("cancel-modal").addEventListener("click",closeModal);
      shade.addEventListener("click",function(e){if(e.target===shade)closeModal();});
      document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
      renderEngines();renderShortcuts();
    })();
  </script>
</body>
</html>
