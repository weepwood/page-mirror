<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the mark on its own: the circle filled with the lawn green, its ring
       and the rail drawn in the leaf ink, no square behind it. Scaled so the
       ring's outer edge (radius 27 plus half the 5 stroke) meets the box. -->
  <g
    fill="none"
    stroke="#1E3A22"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(32 32) scale(1.0847) translate(-32 -32)"
  >
    <circle cx="32" cy="32" r="27" fill="#CDE5B0" stroke-width="5" />
    <path
      d="M15.7 37.1 25 26c4.5-5.4 9.1-9.6 11.5-3l5 13.7c1.4 3.8 3.3 4.1 6.5 3.5"
      stroke-width="5.5"
    />
  </g>
</svg>
